# Kiro thinking-ladder bridge.
#
# WHY THIS FILE EXISTS
# pi-provider-kiro publishes each model's reasoning ladder as `thinkingLevelMap`,
# the field pi read. omp 13.9.3 renamed that contract: "Changed model `reasoning`
# property to `thinking` property with `ThinkingConfig`", and the footer, status
# line and thinking selector now read `model.thinking`. The omp binary contains
# zero occurrences of `thinkingLevelMap`, so every kiro model arrives with
# `thinking: null` and Shift+Tab has no rungs to cycle. kiro is the only provider
# where that is true -- amazon-bedrock declares ladders on 92 models.
#
# The plugin's request path is fine: mapPiLevelToKiroEffort() still maps a level
# to Kiro's effort field, deriving valid values from the live API schema. Only the
# metadata omp reads is missing, and `modelOverrides.<id>.thinking` supplies it.
#
# SHAPE
# `thinking` is a ThinkingConfig OBJECT, not a bare array -- a plain list fails
# validation with "thinking.mode ... was missing". Required `mode` is one of
# effort | budget | google-level | anthropic-adaptive | anthropic-budget-effort,
# and the schema additionally requires one of `efforts`, legacy `levels`, or
# `minLevel`+`maxLevel`. Kiro takes `effort`: the plugin sends a reasoning-effort
# string, not a token budget. Valid rungs are minimal|low|medium|high|xhigh|max.
#
# LADDER SOURCES
# gpt-5-6-*      screenshot-verified in kiro-cli: None/Low/Medium/High/xHigh/Max.
#                The plugin's hardcoded GPT_EFFORT_VALUES stops at xhigh, but
#                getKiroEffortConfig() prefers the live API schema over that
#                fallback, and kiro-cli reads the same schema. Max is real.
# claude-*       all share low..max, confirmed in kiro-cli. Matches the plugin's
#                CLAUDE_EXTENDED_EFFORT_VALUES, which names opus-4.8, sonnet-5
#                and fable-5; opus-5 is absent from that set and derives the
#                same ladder from the live API schema.
#
# `off` is deliberately absent: omp's picker prepends Inherit and Off itself.
# Ids use omp's hyphenated form (gpt-5-6-sol), not the plugin's internal
# dotted normalisation (gpt-5.6-sol).
#
# Safe to stow. omp reads and validates this file but never rewrites it; the only
# write path is a models.json -> models.yml migration, which fires only when no
# YAML file exists. A validation failure disables custom providers and warns; it
# does not break the session.

providers:
  kiro:
    modelOverrides:
      claude-opus-5:
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
      claude-sonnet-5:
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
      claude-opus-4-8:
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
      claude-fable-5:
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
      gpt-5-6-sol:
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
      gpt-5-6-terra:
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
      gpt-5-6-luna:
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
