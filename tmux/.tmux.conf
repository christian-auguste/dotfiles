# Change default prefix to `
unbind C-b
set -g prefix `
bind ` send-prefix

# Refresh/Reload TMUX config (Prefix, r)
unbind r
bind r source-file ~/.tmux.conf

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1

# Set history limit to 100k
set -g history-limit 100000

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Prevent programs from overriding manual window names
set -g allow-rename off
set-option -g set-titles on
set-option -g set-titles-string "#{pane_title}"


# Resizing panes with mouse
set -g mouse on

# Allow programs to bypass tmux with escape sequences (needed for image paste)
set -g allow-passthrough on

# New panes + windows open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# tmux server settings
set-option -s focus-events on
set-option -s extended-keys on
set-option -s escape-time 0

# Move TMUX Status bar to the top
set-option -g status-position top

# Vi copy mode (keyboard fallback: y to copy to the local system clipboard, q to quit)
set -g mode-keys vi
# External copy commands handle the system clipboard; don't emit OSC 52 copies.
set -g set-clipboard off
# Use the local platform clipboard when y is pressed.
if-shell -b 'uname -s | grep -q Darwin' \
  'set -s copy-command pbcopy'
if-shell -b 'uname -s | grep -q Linux' \
  'if-shell -b "test -n \"$WAYLAND_DISPLAY\" && command -v wl-copy >/dev/null 2>&1" "set -s copy-command wl-copy" "set -s copy-command xclip -selection clipboard"'

# Mouse selection: drag highlights, release keeps highlight, click clears it
# No auto-copy — you explicitly Cmd+C (Ghostty) or press y to copy
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Add TMUX Plugin Manager; Install plugins with (Ctrl+b, I)

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-sensible'

# True Colors Support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Load Catppuccin 
run ~/.tmux/plugins/tmux/catppuccin.tmux

# Configure the status line
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
